name: Holy Quran 24/7 Automated Tilawat & Azan Poster

on:
  schedule:
    # Runs every 20 minutes (72 runs per day -> 5 Azan + 67 Long Surahs / Tilawat posts)
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      batch_count:
        description: 'Number of videos to process in this run'
        required: false
        default: '1'

jobs:
  post-quran-tilawat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Latest Changes to Prevent Merge Conflicts
        run: |
          git pull --rebase origin main || true

      - name: Run Quran Tilawat & Azan Engine
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          BATCH=${{ github.event.inputs.batch_count || '1' }}
          python quran_runner.py $BATCH

      - name: Commit and Push State & History
        run: |
          git config --global user.name "QuranBot Automation"
          git config --global user.email "quranbot@automation.local"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: update quran posted history & azan state [skip ci]" && git push origin main) || true
