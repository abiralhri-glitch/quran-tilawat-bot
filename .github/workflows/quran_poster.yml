name: Holy Quran 4 Daily Prime Tilawat Posts (2 Reels + 2 HQ Videos)

on:
  schedule:
    # সকালের পোস্ট: বাংলাদেশ সময় সকাল ০৮:০০ (০২:০০ ইউটিসি)
    - cron: '0 2 * * *'
    # দুপুরের পোস্ট: বাংলাদেশ সময় দুপুর ০১:৩০ (০৭:৩০ ইউটিসি)
    - cron: '30 7 * * *'
    # সন্ধ্যার পোস্ট: বাংলাদেশ সময় বিকাল ০৫:৩০ (১১:৩০ ইউটিসি)
    - cron: '30 11 * * *'
    # রাতের পোস্ট: বাংলাদেশ সময় রাত ০৮:৩০ (১৪:৩০ ইউটিসি)
    - cron: '30 14 * * *'
  workflow_dispatch:
    inputs:
      format:
        description: 'Post format: auto, reel, or video'
        required: false
        default: 'reel'

permissions:
  contents: write

jobs:
  post-quran-tilawat:
    name: Generate & Publish High-Retention Quran Tilawat
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Bengali Fonts & FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core fonts-noto-ui-core ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Latest Changes to Prevent Merge Conflicts
        run: |
          git pull --rebase origin main || true

      - name: Run Quran Tilawat Engine
        env:
          PYTHONUNBUFFERED: "1"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          FORMAT="${{ github.event.inputs.format || 'auto' }}"
          if [ "$FORMAT" = "reel" ] || [ "$FORMAT" = "video" ]; then
            python quran_runner.py "$FORMAT"
          else
            python quran_runner.py
          fi

      - name: Commit and Push State & History
        run: |
          git config --global user.name "QuranBot Automation"
          git config --global user.email "quran-bot@users.noreply.github.com"
          git add posted_history.json assets/footage_state.json replied_comments.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update quran posted history & footage state [skip ci]" || true
          git pull --rebase origin main || true
          git push origin main || true
