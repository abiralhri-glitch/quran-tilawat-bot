name: Holy Quran 10 Daily Tilawat Posts (5 Reels + 5 HQ Videos)

on:
  schedule:
    # সকালের ২টি পোস্ট: বাংলাদেশ সময় সকাল ০৭:৩০ ও ০৯:৩০ (০১:৩০ ও ০৩:৩০ ইউটিসি)
    - cron: '30 1,3 * * *'
    # দুপুর থেকে রাত পর্যন্ত প্রতি ১ ঘণ্টা পর পর: দুপুর ০১:০০ থেকে রাত ১০:০০ পর্যন্ত (০৭:০০ থেকে ১৬:০০ ইউটিসি)
    - cron: '0 7-16 * * *'
  workflow_dispatch:
    inputs:
      format:
        description: 'Post format: auto, reel, or video'
        required: false
        default: 'reel'

permissions:
  contents: write

jobs:
  post-quran-tilawat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull Latest Changes to Prevent Merge Conflicts
        run: |
          git pull --rebase origin main || true

      - name: Run Quran Tilawat Engine
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          FORMAT="${{ github.event.inputs.format || 'auto' }}"
          if [ "$FORMAT" = "reel" ] || [ "$FORMAT" = "video" ]; then
            python quran_runner.py "$FORMAT"
          else
            python quran_runner.py
          fi

      - name: Commit and Push State & History
        run: |
          git config --global user.name "QuranBot Automation"
          git config --global user.email "quran-bot@users.noreply.github.com"
          git add posted_history.json assets/footage_state.json replied_comments.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update quran posted history & footage state [skip ci]" || true
          git pull --rebase origin main || true
          git push origin main || true
